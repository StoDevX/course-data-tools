name: Update Course Data

on:
  schedule:
    - cron:  '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-data:
    # Adapted from https://github.com/StoDevX/AAO-React-Native/blob/master/.github/workflows/cocoapods.yml
    name: Course Data Update
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.COURSE_DATA_TOOLS_GH_PUSH_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: push-on-course-data-change
        run: bash bin/github.sh
        env:
          GITHUB_BRANCH: ${{ github.ref_name }}
          head_ref: ${{ github.ref }}
          GITHUB_OAUTH: ${{ secrets.COURSE_DATA_TOOLS_GH_PUSH_TOKEN }}

      - name: publish-course-catalog
        if: github.ref_name == 'master'
        run: |
          gh release create catalog \
            --repo StoDevX/course-data \
            --title "Course catalog database" \
            --notes "Rolling SQLite build of the St. Olaf course catalog. Rebuilt nightly." \
            || echo "release already exists"
          gh release upload catalog "$GITHUB_WORKSPACE/catalog.db" \
            --repo StoDevX/course-data --clobber
        env:
          GH_TOKEN: ${{ secrets.COURSE_DATA_TOOLS_GH_PUSH_TOKEN }}
