name: Check
on:
  push: {branches: [master]}
  pull_request:
jobs:
  check-deps-and-lint:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Run tests
        run: uv run pytest
      - name: Lint
        run: uv run pylint lib/ bundle.py download.py --errors-only
